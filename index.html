<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="Plan a visit to Australian Reptile Park in Somersby, Central Coast NSW." />
    <title>Australian Reptile Park | Strictons</title>
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./status.js" defer></script>
  </head>
  <body>
    <main class="page">
      <article class="profile" aria-labelledby="business-name">
        <figure class="hero">
          <img
            class="hero-image"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Sleeping_Koala_in_branch_fork.jpg/1024px-Sleeping_Koala_in_branch_fork.jpg"
            alt="A koala resting in the fork of a tree at Australian Reptile Park"
            width="1024"
            height="768"
            fetchpriority="high"
            loading="eager"
            decoding="async"
          />
          <figcaption class="photo-credit">
            Photo: <a href="https://commons.wikimedia.org/wiki/File:Sleeping_Koala_in_branch_fork.jpg" target="_blank" rel="noopener noreferrer">Thebenjaminhuynh</a>
            <span aria-hidden="true">·</span>
            <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>
            <span aria-hidden="true">·</span> Cropped for display
          </figcaption>
        </figure>

        <div class="content">
          <header class="intro">
            <h1 id="business-name">Australian Reptile Park</h1>
            <p class="location">Somersby, Central Coast NSW</p>
            <p class="description">Get up close with Australia's remarkable wildlife, from koalas and kangaroos to crocodiles and reptiles.</p>

            <p
              class="opening-status"
              id="opening-status"
              role="status"
              aria-live="polite"
              title="Open 9:00am to 5:00pm daily, except Christmas Day"
            >
              <span class="status-dot" aria-hidden="true"></span>
              <span id="status-text">Daily 9:00am to 5:00pm</span>
            </p>
          </header>

          <section class="visit" aria-label="Plan your visit">
            <div class="primary-actions">
              <a
                class="action action-primary"
                href="https://www.reptilepark.com.au/book-your-visit/day-passes"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span>Book Tickets</span><span class="arrow" aria-hidden="true">↗</span>
              </a>
              <a
                class="action action-secondary"
                href="https://www.google.com/maps/search/?api=1&amp;query=Australian%20Reptile%20Park%2C%20Pacific%20Highway%2C%20Somersby%20NSW%202250"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span>Get Directions</span><span class="arrow" aria-hidden="true">↗</span>
              </a>
            </div>

            <nav class="extra-links" aria-label="More ways to connect">
              <a href="https://www.reptilepark.com.au/" target="_blank" rel="noopener noreferrer">Website</a>
              <span class="separator" aria-hidden="true"></span>
              <a href="https://www.instagram.com/australianreptilepark/" target="_blank" rel="noopener noreferrer">Instagram</a>
              <span class="separator" aria-hidden="true"></span>
              <a href="tel:+61243401022">Call</a>
            </nav>
          </section>

          <footer class="signature" aria-label="Strictons">
            <span>STRICTONS</span>
          </footer>
        </div>
      </article>
    </main>
  </body>
</html>
